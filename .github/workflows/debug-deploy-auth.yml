name: Debug deploy auth

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify secret present and lengths
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "ERROR: DEPLOY_TOKEN secret is NOT present"
            exit 1
          fi
          echo "DEPLOY_TOKEN length: $(echo -n "${TOKEN}" | wc -c)"

      - name: Show git config & remotes
        run: |
          echo "git config --list:"
          git config --list || true
          echo "git remote -v:"
          git remote -v || true

      - name: Check token identity (GitHub API /user)
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "Calling GitHub API /user (auth test)..."
          http_code=$(curl -s -o /tmp/user.json -w "%{http_code}" -H "Authorization: token ${TOKEN}" https://api.github.com/user)
          echo "HTTP status: $http_code"
          echo "Response (trimmed):"
          cat /tmp/user.json | jq '{login, id, type, name}' || cat /tmp/user.json

      - name: Check repository permissions using token
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "Checking repo permissions for aiyswarrya130399/payment..."
          http_code=$(curl -s -o /tmp/repo.json -w "%{http_code}" -H "Authorization: token ${TOKEN}" https://api.github.com/repos/aiyswarrya130399/payment)
          echo "HTTP status: $http_code"
          echo "Permissions field (if available):"
          cat /tmp/repo.json | jq '.permissions' || cat /tmp/repo.json | sed -n '1,120p'

      - name: Test Git authentication (git ls-remote)
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -x
          AUTH_URL="https://x-access-token:${TOKEN}@github.com/aiyswarrya130399/payment.git"
          echo "Running git ls-remote against authenticated URL (output suppressed if successful)..."
          git ls-remote "${AUTH_URL}" refs/heads/gh-pages || echo "git ls-remote failed (exit code $?)"
          set +x

      - name: Summary
        run: |
          echo "If /user shows 'login' = your account and repo permissions show 'push: true', token+permissions are OK."
          echo "If /user returned 'Bad credentials' or HTTP 401, token is invalid/expired."
          echo "If repo permissions show push: false, the token lacks repo scope or the token owner is not a collaborator."
