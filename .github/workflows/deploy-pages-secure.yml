name: Deploy to GitHub Pages (via PAT) 

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure secrets exist
        run: |
          if [ -z "${{ secrets.DEPLOY_TOKEN }}" ]; then
            echo "ERROR: DEPLOY_TOKEN secret is missing" >&2
            exit 1
          fi
          if [ -z "${{ secrets.MERCHANT_UPI_ID }}" ]; then
            echo "WARNING: MERCHANT_UPI_ID not set. config.js will contain placeholder." >&2
          fi

      - name: Create config.js from repository secrets
        env:
          UPI: ${{ secrets.MERCHANT_UPI_ID }}
          NAME: ${{ secrets.MERCHANT_NAME }}
        run: |
          cat > config.js <<EOF
          // Auto-generated during CI. Do not commit your real config.js with secrets.
          const CONFIG = {
            MERCHANT_UPI_ID: "${UPI:-yourname@paytm}",
            MERCHANT_NAME: "${NAME:-Your Mentorship Program}"
          };
          EOF
          echo "Created config.js (from secrets)."

      - name: (Optional) Build — add steps here if your site needs building
        run: |
          echo "No build step configured. If you need a build (npm ci && npm run build), add it here."

      - name: Deploy to gh-pages via peaceiris (uses PAT)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.DEPLOY_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          commit_message: "ci: publish to gh-pages (via PAT)"
