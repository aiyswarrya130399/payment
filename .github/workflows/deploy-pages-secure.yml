name: Deploy to GitHub Pages (secure: generate config.js from secrets)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create config.js from repository secrets
        env:
          UPI: ${{ secrets.MERCHANT_UPI_ID }}
          NAME: ${{ secrets.MERCHANT_NAME }}
        run: |
          cat > config.js <<EOF
          // Auto-generated during CI. Do not commit your real config.js with secrets.
          const CONFIG = {
            MERCHANT_UPI_ID: "${UPI}",
            MERCHANT_NAME: "${NAME}"
          };
          EOF
          # Do NOT print the secret values. Print only lengths to confirm creation:
          echo "Created config.js — MERCHANT_UPI_ID length: $(echo -n \"$UPI\" | wc -c), MERCHANT_NAME length: $(echo -n \"$NAME\" | wc -c)"

      - name: (Optional) Build — add steps here if your site needs building
        run: |
          echo "No build step configured. If you need a build (npm run build), add it here."

      - name: Show workspace (debug)
        run: |
          echo "Working directory: $(pwd)"
          echo "Files:"
          ls -la
          echo "Git remotes:"
          git remote -v || true
          echo "Git config:"
          git config --list || true

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
